<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Rounded cosmic container -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Crop marks (top-left, top-right, bottom-left, bottom-right) -->
  <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M22 32 V22 H32"/>
    <path d="M96 22 H106 V32"/>
    <path d="M22 96 V106 H32"/>
    <path d="M96 106 H106 V96"/>
  </g>

  <!-- Back card -->
  <rect x="34" y="28" width="44" height="60" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="2.5" transform="rotate(-8 56 58)"/>

  <!-- Front card -->
  <rect x="46" y="34" width="46" height="62" rx="6" fill="url(#card1)" stroke="#e0e7ff" stroke-width="2.5"/>

  <!-- Inner card grid / registration lines -->
  <rect x="54" y="42" width="30" height="22" rx="3" fill="#0f172a" fill-opacity="0.45" stroke="#bae6fd" stroke-opacity="0.5" stroke-width="1.2"/>
  <line x1="54" y1="72" x2="84" y2="72" stroke="#e0e7ff" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="80" x2="74" y2="80" stroke="#a5b4fc" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtle sparkle -->
  <circle cx="96" cy="34" r="3" fill="#34d399"/>
</svg>
